<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { /* Configurações globais das CSS */
            height: 100%;
        }
        body {
        /*  background-image: radial-gradient(circle, #3198E2 1%, #6D59C0, #B93590, #E33F5F, #FDD579 80%); */
            background-image: linear-gradient(to bottom, #3198E2 1%, #6D59C0, #B93590, #E33F5F, #FDD579 90%);
            /* left, right, top, bottom */
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
